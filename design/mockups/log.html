<symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>

<div class="main">
<header class="topbar"><a class="brand" href="dashboard.html"><svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="10" fill="#D8F45A"/><path d="M9 24V11M23 24V11M7 12.5h18M7 18.5h18" stroke="#0F3D2E" stroke-width="3" stroke-linecap="round"/></svg>WellTrack</a><a class="avatar" href="more.html" aria-label="Ana Popescu, account">AP</a></header>
<main class="page" id="main" style="max-width:560px;margin:0 auto;padding-bottom:2rem">
<div style="display:flex;align-items:center;justify-content:space-between;padding:.3rem 0"><h1>Log activity</h1><a class="btn ghost" href="dashboard.html" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#x"/></svg></a></div>
<div class="banner bad" role="alert"><svg class="i" aria-hidden="true"><use href="#alert"/></svg><div>One thing to fix before saving: the duration is too long.</div></div>
<div class="card"><form onsubmit="return false">
<div class="field"><label id="tl">Type</label><div class="pillrow" style="display:grid;grid-template-columns:repeat(3,1fr)" role="group" aria-labelledby="tl"><button class="pillbtn" aria-pressed="true" style="min-height:56px;display:grid;place-items:center">Running</button><button class="pillbtn" aria-pressed="false" style="min-height:56px;display:grid;place-items:center">Cycling</button><button class="pillbtn" aria-pressed="false" style="min-height:56px;display:grid;place-items:center">Swimming</button><button class="pillbtn" aria-pressed="false" style="min-height:56px;display:grid;place-items:center">Yoga</button><button class="pillbtn" aria-pressed="false" style="min-height:56px;display:grid;place-items:center">Gym</button><button class="pillbtn" aria-pressed="false" style="min-height:56px;display:grid;place-items:center">Walking</button></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem"><div class="field"><label for="dt">Date</label><input class="input" id="dt" type="date" value="2026-11-29"></div>
<div class="field"><label for="st">Start time <span class="muted small">optional</span></label><input class="input" id="st" type="time" value="18:30"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem"><div class="field"><label for="du">Duration (min)</label><input class="input num" id="du" inputmode="numeric" aria-invalid="true" aria-describedby="de" value="900"><span class="err" id="de"><svg class="i" aria-hidden="true"><use href="#alert"/></svg>Enter a duration between 1 and 600 minutes.</span></div>
<div class="field"><label for="di">Distance (km) <span class="muted small">optional</span></label><input class="input num" id="di" inputmode="decimal" value="6.2"></div></div>
<div class="field"><label id="il">Intensity</label><div class="seg" role="group" aria-labelledby="il"><button type="button" aria-pressed="false">Light</button><button type="button" aria-pressed="true">Moderate</button><button type="button" aria-pressed="false">Hard</button></div></div>
<div class="field"><label for="nt">Notes</label><textarea class="input" id="nt" rows="2" placeholder="How did it feel?"></textarea></div>
<div style="display:grid;gap:.8rem"><button class="btn go block">Save activity</button></div></form></div></main>
</div></div>
<script src="app.js"></script></body></html>
